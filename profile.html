<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Security | Sim & Mobile</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonBlue: '#00f3ff',
                        neonGold: '#fadb5f',
                        darkBg: '#0b0f19',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="antialiased font-sans bg-darkBg text-white selection:bg-neonBlue selection:text-black min-h-screen flex flex-col relative overflow-x-hidden">

    <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-neonBlue/5 to-transparent pointer-events-none -z-10"></div>

    <nav class="fixed w-full z-40 glass-panel border-b border-white/10 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-wider text-neonBlue">
                SIM <span class="text-white">&amp; MOBILE</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="text-xs font-mono text-gray-400 hover:text-neonBlue transition border border-gray-700 hover:border-neonBlue px-4 py-1.5 rounded-full">
                    [ BACK_TO_DASHBOARD ]
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-3xl mx-auto px-6 pt-32 pb-20 w-full space-y-8">
        
        <div class="mb-4">
            <h1 class="text-3xl font-black uppercase tracking-tighter">Security Matrix</h1>
            <p class="text-gray-400 text-sm mt-1">Manage your node credentials and cryptographic access clearance keys.</p>
        </div>

        <div class="glass-panel p-8 md:p-10 rounded-3xl border border-white/5 shadow-2xl">
            <h2 class="text-sm font-bold text-neonBlue mb-6 font-mono uppercase tracking-widest">01 // Account Identity Matrix</h2>
            
            <form id="profile-identity-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs text-gray-400 uppercase tracking-widest mb-2 font-mono">Account Full Name</label>
                        <input type="text" id="prof-name" required minlength="2" maxlength="40" pattern="^[a-zA-Z\s]+$"
                            class="w-full bg-black/40 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-neonBlue transition font-medium">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 uppercase tracking-widest mb-2 font-mono">Email Address Binding</label>
                        <input type="email" id="prof-email" required
                            class="w-full bg-black/40 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-neonBlue transition font-mono">
                    </div>
                </div>
                
                <div class="flex justify-end pt-2">
                    <button type="submit" id="btn-save-identity"
                        class="bg-transparent border-2 border-neonBlue text-neonBlue font-bold px-8 py-3 rounded-xl hover:bg-neonBlue hover:text-black transition-all shadow-[0_0_15px_rgba(0,243,255,0.1)] text-xs font-mono uppercase tracking-widest">
                        UPDATE_IDENTITY_
                    </button>
                </div>
            </form>
        </div>

        <div class="glass-panel p-8 md:p-10 rounded-3xl border border-white/5 shadow-2xl">
            <h2 class="text-sm font-bold text-neonBlue mb-6 font-mono uppercase tracking-widest">02 // Cryptographic Access Modification</h2>
            
            <form id="profile-password-form" class="space-y-6">
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs text-gray-400 uppercase tracking-widest mb-2 font-mono">Current Password Check</label>
                        <input type="password" id="pass-current" required placeholder="••••••••"
                            class="w-full bg-black/40 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-neonBlue transition font-mono max-w-md">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs text-gray-400 uppercase tracking-widest mb-2 font-mono">New Access Password</label>
                            <input type="password" id="pass-new" required minlength="8" placeholder="••••••••"
                                class="w-full bg-black/40 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-neonBlue transition font-mono">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 uppercase tracking-widest mb-2 font-mono">Confirm New Access Password</label>
                            <input type="password" id="pass-confirm" required minlength="8" placeholder="••••••••"
                                class="w-full bg-black/40 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-neonBlue transition font-mono">
                        </div>
                    </div>
                </div>
                
                <div class="flex justify-end pt-4">
                    <button type="submit" id="btn-save-password"
                        class="bg-transparent border-2 border-neonBlue text-neonBlue font-bold px-8 py-3 rounded-xl hover:bg-neonBlue hover:text-black transition-all shadow-[0_0_15px_rgba(0,243,255,0.1)] text-xs font-mono uppercase tracking-widest">
                        EXECUTE_PASSWORD_RESET_
                    </button>
                </div>
            </form>
        </div>

    </main>

    <div id="security-code-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="w-[90%] max-w-md bg-[#0b0f19] border border-white/10 p-8 rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.8)] relative transform scale-95 transition-transform duration-300">
            
            <button id="btn-close-security-modal" class="absolute top-5 right-5 text-gray-500 hover:text-white transition font-mono text-xs">[ ESC ]</button>
            
            <div class="space-y-6">
                <div class="text-center">
                    <div class="inline-block px-2.5 py-0.5 bg-neonGold/10 border border-neonGold/30 text-neonGold font-mono text-[10px] uppercase tracking-widest rounded-full mb-3">
                        🔒 MFA PROTOCOL GATEWAY
                    </div>
                    <h2 class="text-xl font-black text-white uppercase tracking-wide">Security Clearance</h2>
                    <p id="modal-security-description" class="text-xs text-gray-400 mt-1">Provide authorization codes emitted via email pipelines.</p>
                </div>

                <form id="global-verification-gateway-form" class="space-y-4">
                    
                    <div id="wrapper-code-primary">
                        <label id="label-code-primary" class="block text-[10px] text-gray-400 uppercase tracking-widest mb-1.5 font-mono">Verification Passkey</label>
                        <input type="text" id="input-code-primary" required placeholder="6-DIGIT CODE" maxlength="6" pattern="\d{6}"
                            class="w-full bg-black/40 border border-gray-700 text-white placeholder-gray-600 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-neonGold font-mono text-center tracking-widest text-base">
                    </div>

                    <div id="wrapper-code-secondary" class="hidden">
                        <label class="block text-[10px] text-neonBlue uppercase tracking-widest mb-1.5 font-mono">New Email Verification Passkey</label>
                        <input type="text" id="input-code-secondary" placeholder="6-DIGIT CODE" maxlength="6" pattern="\d{6}"
                            class="w-full bg-black/40 border border-gray-700 text-white placeholder-gray-600 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-neonBlue font-mono text-center tracking-widest text-base">
                    </div>

                    <button type="submit" id="btn-submit-gate-clearance" class="w-full bg-neonGold text-black font-black py-3 rounded-xl hover:bg-white transition uppercase tracking-widest text-xs font-mono shadow-[0_0_15px_rgba(250,219,95,0.2)]">
                        AUTHORIZE_COMMIT_
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/profile.js"></script>
</body>

</html>
