<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessories Showcase | Sim & Mobile</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonBlue: '#00f3ff',
                        neonGold: '#fadb5f',
                        darkBg: '#080b12',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <style>
        .cond-btn.cond-active {
            background-color: rgba(0, 243, 255, 0.15);
            border-color: #00f3ff;
            color: #00f3ff;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }
        /* Member-price toggle switch */
        .switch input:checked + .track { background-color: rgba(250, 219, 95, 0.4); }
        .switch input:checked + .track .knob { transform: translateX(20px); background-color: #fadb5f; }
        input[type="range"] { accent-color: #00f3ff; }
    </style>
</head>

<body
    class="antialiased font-sans bg-darkBg text-white selection:bg-neonBlue selection:text-black min-h-screen flex flex-col">

    <nav class="fixed w-full z-50 bg-darkBg/90 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-wider text-neonBlue hover:opacity-80 transition">
                SIM <span class="text-white">&</span> MOBILE
            </a>
            <a href="index.html" aria-label="Return to Home"
                class="hidden md:flex items-center gap-2 text-gray-300 hover:text-neonBlue transition font-mono text-sm border border-gray-600 hover:border-neonBlue px-4 py-2 rounded-full">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                    </path>
                </svg>
                Back to Home
            </a>
            <a href="index.html" aria-label="Return to Home" class="md:hidden text-gray-300 hover:text-neonBlue transition p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                    </path>
                </svg>
            </a>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-20 px-6 relative overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-1/2 bg-neonBlue/10 blur-[120px] rounded-full pointer-events-none -z-10"></div>

        <div class="max-w-7xl mx-auto">
            <header class="text-center mb-10">
                <h1 class="text-4xl md:text-5xl font-black mb-3">Accessories <span class="text-neonBlue glow-text">Showcase</span></h1>
                <p class="text-gray-400 max-w-2xl mx-auto">Cases, charging, audio, certified refurbished devices and genuine-grade parts. Filter the catalogue to find your match.</p>
            </header>

            <!-- Member view + sort + search bar -->
            <div class="glass-panel rounded-2xl p-4 mb-8 flex flex-col md:flex-row gap-4 md:items-center md:justify-between">
                <div class="relative flex-grow md:max-w-sm">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">🔍</span>
                    <input id="search-input" type="text" placeholder="Search products, brands…"
                        class="w-full bg-black/40 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-gray-500 border border-white/10 focus:border-neonBlue focus:outline-none font-mono">
                </div>
                <div class="flex items-center gap-4 flex-wrap">
                    <label class="switch flex items-center gap-2 cursor-pointer select-none">
                        <span class="text-xs font-mono text-gray-400">Member pricing</span>
                        <input id="member-toggle" type="checkbox" class="sr-only">
                        <span class="track relative w-10 h-5 rounded-full bg-white/10 transition">
                            <span class="knob absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-gray-400 transition"></span>
                        </span>
                    </label>
                    <select id="sort-select"
                        class="bg-black/40 border border-white/10 text-xs font-mono rounded-xl px-3 py-2.5 focus:outline-none focus:border-neonBlue text-white">
                        <option value="rating-desc">Top rated</option>
                        <option value="price-asc">Price: low → high</option>
                        <option value="price-desc">Price: high → low</option>
                        <option value="name-asc">Name: A → Z</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-col lg:flex-row gap-8">
                <!-- Filter sidebar -->
                <aside class="lg:w-64 flex-shrink-0">
                    <div class="glass-panel rounded-2xl p-6 lg:sticky lg:top-28 space-y-7">
                        <div class="flex items-center justify-between">
                            <h2 class="text-sm font-bold font-mono uppercase tracking-wider text-white">Filters</h2>
                            <button id="reset-filters" class="text-[10px] font-mono text-neonBlue hover:underline">Reset</button>
                        </div>

                        <div>
                            <p class="text-[10px] font-mono uppercase tracking-widest text-gray-500 mb-3">Condition</p>
                            <div class="flex gap-2">
                                <button data-cond="All" class="cond-btn cond-active text-xs font-mono px-3 py-1.5 rounded-lg border border-white/10 text-gray-400 transition">All</button>
                                <button data-cond="New" class="cond-btn text-xs font-mono px-3 py-1.5 rounded-lg border border-white/10 text-gray-400 transition">New</button>
                                <button data-cond="Refurbished" class="cond-btn text-xs font-mono px-3 py-1.5 rounded-lg border border-white/10 text-gray-400 transition">Refurb</button>
                            </div>
                        </div>

                        <div>
                            <p class="text-[10px] font-mono uppercase tracking-widest text-gray-500 mb-3">Category</p>
                            <div id="category-chips" class="flex flex-wrap gap-2"></div>
                        </div>

                        <div>
                            <p class="text-[10px] font-mono uppercase tracking-widest text-gray-500 mb-3">Brand</p>
                            <div id="brand-chips" class="flex flex-wrap gap-2"></div>
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <p class="text-[10px] font-mono uppercase tracking-widest text-gray-500">Max price</p>
                                <span id="price-label" class="text-xs font-mono text-neonBlue">$0</span>
                            </div>
                            <input id="price-slider" type="range" class="w-full cursor-pointer">
                        </div>

                        <!-- Restock alert mini-form (uses shared Validators module) -->
                        <div class="border-t border-white/5 pt-5">
                            <p class="text-[10px] font-mono uppercase tracking-widest text-gray-500 mb-2">Restock alerts</p>
                            <input id="notify-email" type="email" placeholder="you@email.com"
                                class="w-full bg-black/40 rounded-lg px-3 py-2 text-xs text-white placeholder-gray-600 border border-white/10 focus:border-neonBlue focus:outline-none font-mono mb-2">
                            <button id="notify-btn" class="w-full bg-neonBlue/15 text-neonBlue text-xs font-mono border border-neonBlue/30 py-2 rounded-lg hover:bg-neonBlue hover:text-black transition">Notify me</button>
                            <p id="notify-msg" class="text-xs font-mono mt-2"></p>
                        </div>
                    </div>
                </aside>

                <!-- Product grid -->
                <section class="flex-grow">
                    <div class="flex items-center justify-between mb-5">
                        <p id="result-count" class="text-sm font-mono text-gray-400">0 products</p>
                    </div>
                    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5"></div>
                </section>
            </div>
        </div>
    </main>

    <!-- Floating cart bar (revealed when the cart has items) -->
    <div id="cart-bar" class="fixed bottom-0 left-0 w-full z-40 translate-y-full transition-transform duration-300">
        <div class="max-w-7xl mx-auto px-6 pb-5">
            <div class="glass-panel rounded-2xl border border-neonBlue/30 shadow-[0_0_30px_rgba(0,243,255,0.15)] px-5 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">🛒</span>
                    <div>
                        <p id="cart-summary" class="text-sm font-bold text-white">0 items</p>
                        <p id="cart-total" class="text-xs font-mono text-neonGold">$0</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button id="cart-clear" class="text-[11px] font-mono text-gray-400 hover:text-red-400 transition">Clear</button>
                    <a href="checkout.html" class="bg-neonBlue text-black font-bold text-sm px-6 py-2.5 rounded-xl hover:bg-white transition shadow-[0_0_15px_rgba(0,243,255,0.4)] uppercase tracking-wide">Checkout →</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/shop.js"></script>
</body>

</html>
