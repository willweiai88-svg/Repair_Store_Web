<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Command Center - Sim & Mobile</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { neonBlue: '#00f3ff', neonGold: '#fadb5f', darkBg: '#0b0f19' }
                }
            }
        }
    </script>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body
        class="antialiased font-sans bg-darkBg text-white selection:bg-neonBlue selection:text-black min-h-screen">

        <nav
            class="fixed w-full z-50 glass-panel border-b border-white/10 backdrop-blur-xl">
            <div
                class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <a href="index.html"
                    class="text-2xl font-bold tracking-wider text-neonBlue">SIM
                    <span
                        class="text-white">&</span> MOBILE</a>
                <div class="flex items-center gap-6">
                    <button onclick="logout()"
                        class="bg-transparent border border-red-500 text-red-500 px-5 py-1.5 rounded-full text-xs font-bold hover:bg-red-500 hover:text-white transition shadow-[0_0_10px_rgba(239,68,68,0.2)]">
                        LOGOUT
                    </button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-6 pt-32 pb-20">

            <section id="guest-tracking" class="max-w-2xl mx-auto mb-16 hidden">
                <div
                    class="glass-panel p-8 rounded-3xl border border-neonBlue/30 shadow-[0_0_30px_rgba(0,243,255,0.1)]">
                    <h2 class="text-2xl font-black mb-6 uppercase">Track Your
                        <span class="text-neonBlue">Protocol</span>
                    </h2>
                    <div class="space-y-4">
                        <input type="text" id="track-id"
                            placeholder="Order ID (e.g. 6625...)"
                            class="w-full bg-black/40 border border-gray-700 p-4 rounded-xl focus:border-neonBlue outline-none transition">
                        <input type="tel" id="track-phone"
                            placeholder="Registered Phone Number"
                            class="w-full bg-black/40 border border-gray-700 p-4 rounded-xl focus:border-neonBlue outline-none transition">
                        <button onclick="trackOrder()"
                            class="w-full bg-neonBlue text-black font-black py-4 rounded-xl hover:shadow-[0_0_20px_rgba(0,243,255,0.4)] transition">EXECUTE
                            SEARCH</button>
                    </div>
                </div>
            </section>

            <section id="member-dashboard" class="space-y-10">
                <div
                    class="flex flex-col md:flex-row justify-between items-end gap-4">
                    <div>
                        <h1
                            class="text-4xl font-black uppercase tracking-tighter">
                            <span
                                class="text-neonBlue"> Repair
                                History</span></h1>
                        <p class="text-gray-200 font-mono">UserName: <span
                                id="display-name"
                                class="text-neonBlue">--</span>
                        </p>
                    </div>
                    <div class="flex gap-4">
                        <div
                            class="glass-panel px-6 py-3 rounded-2xl border-l-4 border-neonGold text-center">
                            <h2
                                class="text-[10px] text-gray-200 uppercase tracking-widest font-bold">Active
                                Repairs</h2>
                            <p id="stat-active" class="text-xl font-bold">0</p>
                        </div>
                        <div
                            class="glass-panel px-6 py-3 rounded-2xl border-l-4 border-green-500 text-center">
                            <h2
                                class="text-[10px] text-gray-200 uppercase tracking-widest font-bold">Warranty
                                Safe</h2>
                            <p id="stat-warranty"
                                class="text-xl font-bold">0</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-6" id="orders-container">
                    <div class="text-center py-20 opacity-20">
                        <p class="text-4xl mb-4">📂</p>
                        <p>No repair protocols found in your history.</p>
                    </div>
                </div>
            </section>
        </main>
        <!-- Review Submission Pop-up Modal Overlay -->
        <div id="dashboard-review-modal"
            class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
            <div
                class="w-[90%] max-w-md bg-[#0b0f19] border border-white/10 p-8 rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.8)] relative transform scale-95 transition-transform duration-300">

                <button id="btn-close-review-modal"
                    class="absolute top-5 right-5 text-gray-500 hover:text-white transition font-mono text-xs">[
                    ESC ]</button>

                <div class="space-y-6">
                    <div class="text-center">
                        <div
                            class="inline-block px-2.5 py-0.5 bg-neonGold/10 border border-neonGold/30 text-neonGold font-mono text-[10px] uppercase tracking-widest rounded-full mb-3">
                            📝 VERIFIED FEEDBACK NODE
                        </div>
                        <h2
                            class="text-xl font-black text-white uppercase tracking-wide">Share
                            Your Experience</h2>
                        <p class="text-xs text-gray-400 mt-1">Broadcast your
                            transaction review payload directly to the network
                            mainframe.</p>
                    </div>

                    <form id="dashboard-review-form" class="space-y-4">
                        <!-- Hidden or Read-only locked pipeline variables -->
                        <input type="hidden" id="modal-rev-booking-id">
                        <input type="hidden" id="modal-rev-device">
                        <input type="hidden" id="modal-rev-service">

                        <div>
                            <label
                                class="block text-[10px] text-gray-500 uppercase tracking-widest mb-1 font-mono">Target
                                Device & Service</label>
                            <p id="modal-display-target"
                                class="text-sm font-bold text-neonBlue bg-white/5 px-4 py-3 rounded-xl border border-white/5">LOADING...</p>
                        </div>

                        <div>
                            <label
                                class="block text-[10px] text-gray-500 uppercase tracking-widest mb-1.5 font-mono">Rating
                                Matrix</label>
                            <div class="flex gap-2 text-2xl"
                                id="modal-star-container">
                                <button type="button"
                                    class="dash-star-select text-neonGold transition"
                                    data-val="1">★</button>
                                <button type="button"
                                    class="dash-star-select text-neonGold transition"
                                    data-val="2">★</button>
                                <button type="button"
                                    class="dash-star-select text-neonGold transition"
                                    data-val="3">★</button>
                                <button type="button"
                                    class="dash-star-select text-neonGold transition"
                                    data-val="4">★</button>
                                <button type="button"
                                    class="dash-star-select text-neonGold transition"
                                    data-val="5">★</button>
                            </div>
                        </div>

                        <div>
                            <label
                                class="block text-[10px] text-gray-500 uppercase tracking-widest mb-1.5 font-mono">Experience
                                Payload Description</label>
                            <textarea id="modal-rev-content" rows="4" required
                                placeholder="Describe repair quality metrics, processing speeds, or tech terminal communication parameters..."
                                class="w-full bg-black/40 border border-gray-700 text-white placeholder-gray-600 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-neonBlue resize-none"></textarea>
                        </div>

                        <button type="submit" id="btn-dashboard-submit-review"
                            class="w-full bg-neonGold text-black font-black py-3 rounded-xl hover:bg-white transition uppercase tracking-widest text-xs font-mono shadow-[0_0_15px_rgba(250,219,95,0.2)]">
                            COMMIT_FEEDBACK_LOG_
                        </button>
                    </form>
                </div>
            </div>
        </div>
        <script src="js/config.js"></script>
        <script src="js/dashboard.js"></script>
    </body>

</html>
