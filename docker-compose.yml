services:
  database_node:
    image: mongo:latest
    container_name: sim_mobile_mongodb_container
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data_store:/data/db
      - ./init-db/import.sh:/docker-entrypoint-initdb.d/import.sh
      - ./init-db/services.json:/docker-entrypoint-initdb.d/services.json
      - ./init-db/admin.json:/docker-entrypoint-initdb.d/admin.json
      - ./init-db/users.json:/docker-entrypoint-initdb.d/users.json
      - ./init-db/bookings.json:/docker-entrypoint-initdb.d/bookings.json
      - ./init-db/reviews.json:/docker-entrypoint-initdb.d/reviews.json
      - ./init-db/enquiries.json:/docker-entrypoint-initdb.d/enquiries.json
    networks:
      - sim_mobile_virtual_network

  backend_app:
    build: .
    container_name: sim_mobile_express_server
    ports:
      - '5000:5000'
    environment:
      - MONGO_URI=mongodb://database_node:27017/sim_mobile_db
      - PORT=5000
      - GMAIL_USER=simandobusiness@gmail.com
      - GMAIL_PASS=qeiw tmwy pzyz ewyq
    depends_on:
      - database_node
    networks:
      - sim_mobile_virtual_network

volumes:
  mongodb_data_store:

networks:
  sim_mobile_virtual_network:
    driver: bridge
